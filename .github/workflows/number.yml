# Gives every idea its number in the title (IDEA-0042: ...) and marks new ideas needs-triage.
# The number is the issue number, so it never changes. Editing the title keeps the prefix correct.
name: Number ideas

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

concurrency:
  group: number-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  number:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const id = `IDEA-${String(issue.number).padStart(4, '0')}`;
            const bare = String(issue.title || '').replace(/^\s*IDEA-\d+\s*[:·-]\s*/i, '').trim() || 'Untitled idea';
            const title = `${id}: ${bare}`;
            if (issue.title !== title) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, title });
              core.info(`Titled ${title}`);
            }
            if (context.payload.action === 'opened') {
              const labels = issue.labels.map((l) => l.name);
              if (!labels.some((l) => l.startsWith('outcome:')) && !labels.includes('needs-triage')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['needs-triage'] });
              }
            }
